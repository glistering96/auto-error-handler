<!doctype html>
<html lang="ko">
<head>

  <title>{% block title %}오류 처리 리뷰{% endblock %} · Auto Error Handler</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/review.css">
</head>
<body>

    <div class="shell header-inner">

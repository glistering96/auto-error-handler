    function usePanZoom() {
      const viewportRef = useRef(null);
      const canvasRef = useRef(null);
      const zoomDisplayRef = useRef(null);
      const state = useRef({ zoom:1, panX:0, panY:0 });
      const drag = useRef({ on:false, x:0, y:0 });
      const apply = useCallback(() => {
        const value = state.current;
        if (canvasRef.current) {
          canvasRef.current.style.transform = "translate(" + value.panX + "px," + value.panY + "px) scale(" + value.zoom + ")";
        }
        if (zoomDisplayRef.current) zoomDisplayRef.current.textContent = Math.round(value.zoom * 100) + "%";
      }, []);
      const fitToScreen = useCallback(() => {
        const canvas = canvasRef.current;
        const svg = canvas && canvas.querySelector("svg");
        const viewport = viewportRef.current;
        if (!canvas || !svg || !viewport) return;
        const current = state.current;
        const width = canvas.getBoundingClientRect().width / current.zoom;
        const height = canvas.getBoundingClientRect().height / current.zoom;
        const fit = Math.max(.18, Math.min(1.45, Math.min((viewport.clientWidth - 40) / width, (viewport.clientHeight - 40) / height)));
        current.zoom = fit;
        current.panX = (viewport.clientWidth - width * fit) / 2;
        current.panY = (viewport.clientHeight - height * fit) / 2;
        apply();
      }, [apply]);
      useEffect(() => {
        const viewport = viewportRef.current;
        if (!viewport) return undefined;
        const onWheel = (event) => {
          event.preventDefault();
          const rect = viewport.getBoundingClientRect();
          const mx = event.clientX - rect.left;
          const my = event.clientY - rect.top;
          const current = state.current;
          const factor = event.deltaY < 0 ? 1.12 : 1 / 1.12;
          const next = Math.min(4, Math.max(.18, current.zoom * factor));
          const scale = next / current.zoom;
          current.panX = mx - scale * (mx - current.panX);
          current.panY = my - scale * (my - current.panY);
          current.zoom = next;
          apply();
        };
        const onDown = (event) => {
          if (event.target.closest(".node")) return;
          drag.current = { on:true, x:event.clientX, y:event.clientY };
          viewport.setPointerCapture(event.pointerId);
        };
        const onMove = (event) => {
          if (!drag.current.on) return;
          state.current.panX += event.clientX - drag.current.x;
          state.current.panY += event.clientY - drag.current.y;
          drag.current.x = event.clientX;
          drag.current.y = event.clientY;
          apply();
        };
        const onUp = () => { drag.current.on = false; };
        viewport.addEventListener("wheel", onWheel, { passive:false });
        viewport.addEventListener("pointerdown", onDown);
        viewport.addEventListener("pointermove", onMove);
        viewport.addEventListener("pointerup", onUp);
        viewport.addEventListener("pointercancel", onUp);
        window.addEventListener("resize", fitToScreen);
        return () => {
          viewport.removeEventListener("wheel", onWheel);
          viewport.removeEventListener("pointerdown", onDown);
          viewport.removeEventListener("pointermove", onMove);
          viewport.removeEventListener("pointerup", onUp);
          viewport.removeEventListener("pointercancel", onUp);
          window.removeEventListener("resize", fitToScreen);
        };
      }, [apply, fitToScreen]);
      const zoomIn = useCallback(() => { state.current.zoom = Math.min(4, state.current.zoom * 1.25); apply(); }, [apply]);
      const zoomOut = useCallback(() => { state.current.zoom = Math.max(.18, state.current.zoom / 1.25); apply(); }, [apply]);
      return { viewportRef, canvasRef, zoomDisplayRef, zoomIn, zoomOut, fitToScreen };
    }

    function MermaidDiagram({ onNodeClick, onRendered }) {
      const ref = useRef(null);
      useEffect(() => {
        window.nodeClickHandler = onNodeClick;
        window.mermaid.initialize({
          startOnLoad:false, theme:"dark", securityLevel:"loose",
          themeVariables:{
            primaryColor:"#0a0a0a", primaryTextColor:"#fff", primaryBorderColor:"#2a2a2a",
            lineColor:"#a0a0a0", background:"#000", secondaryColor:"#000", tertiaryColor:"#000",
            mainBkg:"#0a0a0a", nodeBorder:"#2a2a2a", clusterBkg:"rgba(10,10,10,.8)",
            clusterBorder:"#7c3aed", titleColor:"#fff", edgeLabelBackground:"transparent"
          },
          flowchart:{ useMaxWidth:false, htmlLabels:true, curve:"basis" }
        });
        window.mermaid.render("walkthrough-diagram", DIAGRAM).then(({ svg, bindFunctions }) => {
          if (!ref.current) return;
          ref.current.innerHTML = svg;
          if (bindFunctions) bindFunctions(ref.current);
          onRendered();
        }).catch((error) => {
          console.error("Mermaid render failed:", error);
          if (ref.current) ref.current.textContent = "Diagram rendering failed. Check the browser console.";
        });
        return () => { delete window.nodeClickHandler; };
      }, [onNodeClick, onRendered]);
      return h("div", { ref, className:"mermaid-wrap" });
    }

    function Summary({ collapsed, onToggle }) {
      if (collapsed) {
        return h("button", {
          onClick:onToggle,
          className:"fixed top-20 left-6 z-20 px-3 py-1.5 glass border border-wt-border rounded-full text-xs text-wt-muted hover:text-white hover:border-wt-accent transition"
        }, "ℹ︎ 핵심 요약");
      }
      return h("button", {
        onClick:onToggle,
        className:"fixed top-20 left-6 z-20 max-w-xl text-left px-5 py-4 glass border border-wt-border rounded-xl shadow-2xl"
      },
        h("div", { className:"text-[11px] uppercase tracking-[.18em] text-wt-accent font-bold mb-2" }, "TL;DR"),
        h("p", { className:"text-sm text-wt-muted leading-relaxed" }, SUMMARY),
        h("p", { className:"text-[10px] text-wt-muted/50 mt-2" }, "클릭해서 접기")
      );
    }

    function DetailPanel({ nodeId, node, onClose }) {
      useEffect(() => {
        const onKey = (event) => { if (event.key === "Escape") onClose(); };
        document.addEventListener("keydown", onKey);
        return () => document.removeEventListener("keydown", onKey);
      }, [onClose]);
      return h("aside", { className:"detail-panel fixed top-4 right-4 bottom-4 w-[560px] z-40 glass border border-wt-border rounded-2xl shadow-2xl flex flex-col overflow-hidden" },
        h("button", {
          onClick:onClose,
          className:"absolute top-4 right-4 z-10 w-8 h-8 rounded-lg border border-wt-border bg-wt-raised text-wt-muted text-xl hover:bg-wt-red hover:text-white transition"
        }, "×"),
        h("div", { className:"flex-1 overflow-y-auto p-6" },
          h("div", { className:"text-[10px] uppercase tracking-[.2em] text-wt-accent font-bold mb-2" }, "Flow node"),
          h("h2", { className:"text-xl font-bold text-white mb-3 pr-10" }, node.title),
          h("div", { className:"dt-body" }, h("p", null, node.description)),
          h("div", { className:"dt-body" },
            HIGHLIGHTED[nodeId]
              ? h("div", { dangerouslySetInnerHTML:{ __html:HIGHLIGHTED[nodeId] } })
              : h("pre", { className:"code-fallback" }, h("code", null, node.code))
          ),
          h("div", { className:"mt-4 pt-4 border-t border-wt-border" },
            h("div", { className:"text-[10px] uppercase tracking-[.16em] text-wt-muted font-bold mb-2" }, "근거 파일"),
            node.files.map((file) => h("code", { key:file, className:"block text-sm text-wt-file font-mono leading-relaxed" }, file))
          )
        )
      );
    }

    function StepCard({ item, index }) {
      return h("div", { className:"step-line relative pl-11 pb-5" },
        h("div", { className:"absolute left-0 top-0 w-8 h-8 rounded-full border border-wt-accent bg-wt-raised text-wt-file flex items-center justify-center text-xs font-bold" }, String(index + 1)),
        h("div", { className:"rounded-xl border border-wt-border bg-wt-raised/60 p-4" },
          h("div", { className:"flex items-start justify-between gap-3" },
            h("h3", { className:"text-sm font-semibold text-white" }, item.title),
            h("span", { className:"text-[9px] tracking-wider text-wt-file border border-wt-accent/40 rounded-full px-2 py-1 whitespace-nowrap" }, item.badge)
          ),
          h("p", { className:"text-xs text-wt-muted leading-relaxed mt-2" }, item.body)
        )
      );
    }

    function NextCard({ item }) {
      return h("div", { className:"rounded-xl border border-wt-border bg-wt-raised/60 p-4" },
        h("div", { className:"text-[9px] uppercase tracking-[.18em] text-wt-accent font-bold" }, item.priority),
        h("h3", { className:"text-sm font-semibold text-white mt-1.5" }, item.title),
        h("p", { className:"text-xs text-wt-muted leading-relaxed mt-2" }, item.body)
      );
    }

    function GuidePanel({ mode, onMode, onClose }) {
      const onboarding = mode === "onboarding";
      return h("aside", { className:"guide-panel fixed top-4 right-4 bottom-4 w-[620px] z-50 glass border border-wt-border rounded-2xl shadow-2xl flex flex-col overflow-hidden" },
        h("div", { className:"flex items-center gap-2 p-4 border-b border-wt-border" },
          h("button", { onClick:() => onMode("onboarding"), className:"px-3 py-2 rounded-lg text-xs font-semibold " + (onboarding ? "bg-wt-accent text-white" : "bg-wt-raised text-wt-muted") }, "외부 서비스 등록"),
          h("button", { onClick:() => onMode("next"), className:"px-3 py-2 rounded-lg text-xs font-semibold " + (!onboarding ? "bg-wt-accent text-white" : "bg-wt-raised text-wt-muted") }, "다음 구현 순서"),
          h("button", { onClick:onClose, className:"ml-auto w-8 h-8 rounded-lg border border-wt-border bg-wt-raised text-wt-muted text-xl hover:bg-wt-red hover:text-white transition" }, "×")
        ),
        h("div", { className:"flex-1 overflow-y-auto p-6" },
          onboarding
            ? h(window.React.Fragment, null,
                h("div", { className:"mb-5" },
                  h("div", { className:"text-[10px] uppercase tracking-[.2em] text-wt-accent font-bold" }, "Recommended onboarding"),
                  h("h2", { className:"text-xl font-bold mt-2" }, "직접 MQ를 만지게 하지 않는 셀프서비스 등록"),
                  h("p", { className:"text-sm text-wt-muted leading-relaxed mt-2" }, "외부 사용자는 UI/API로 서비스만 등록하고, 플랫폼이 Git 검증과 RabbitMQ topology·최소 권한 credential을 생성하는 방식이 가장 안전합니다.")
                ),
                ONBOARDING_STEPS.map((item,index) => h(StepCard, { item, index, key:item.title })),
                h("div", { className:"rounded-xl border border-wt-accent/40 bg-wt-accent/10 p-4" },
                  h("h3", { className:"text-sm font-semibold text-wt-file" }, "클라이언트 제공물"),
                  h("p", { className:"text-xs text-wt-muted leading-relaxed mt-2" }, "TypeScript·Java·Python Publisher SDK, durable outbox 예제, JSON Schema와 CI 계약 테스트 CLI를 제공해야 온보딩 오류를 줄일 수 있습니다.")
                )
              )
            : h(window.React.Fragment, null,
                h("div", { className:"mb-5" },
                  h("div", { className:"text-[10px] uppercase tracking-[.2em] text-wt-accent font-bold" }, "Delivery roadmap"),
                  h("h2", { className:"text-xl font-bold mt-2" }, "이제 무엇을 구현해야 하나"),
                  h("p", { className:"text-sm text-wt-muted leading-relaxed mt-2" }, "P0 계약을 고정하고 등록 → MQ ingest → 분석 → 승인 → 패치의 단일 수직 슬라이스를 완성합니다.")
                ),
                h("div", { className:"grid grid-cols-1 gap-3" }, NEXT_STEPS.map((item) => h(NextCard, { item, key:item.title }))),
                h("div", { className:"mt-5 rounded-xl border border-wt-border p-4" },
                  h("div", { className:"text-[10px] uppercase tracking-[.18em] text-wt-muted font-bold" }, "첫 번째 완료 기준"),
                  h("p", { className:"text-xs text-wt-muted leading-relaxed mt-2" }, "샘플 서비스가 등록·활성화되고 동일 MQ 이벤트를 반복 발행해도 Incident는 하나만 생기며, 승인 전에는 Git diff가 없고 승인 후에만 검증된 Draft PR이 생성되어야 합니다.")
                )
              )
        )
      );
    }

    function ZoomControls({ zoomDisplayRef, onZoomIn, onZoomOut, onFit }) {
      const cls = "w-9 h-9 bg-wt-surface border border-wt-border text-wt-muted hover:text-white hover:border-wt-accent transition";
      return h("div", { className:"fixed bottom-5 left-5 z-20 flex items-center shadow-xl" },
        h("button", { onClick:onZoomOut, className:cls + " rounded-l-lg", title:"축소" }, "−"),
        h("span", { ref:zoomDisplayRef, className:"h-9 min-w-[58px] px-2 bg-wt-surface border-y border-wt-border text-xs text-wt-muted flex items-center justify-center" }, "100%"),
        h("button", { onClick:onZoomIn, className:cls, title:"확대" }, "+"),
        h("button", { onClick:onFit, className:cls + " rounded-r-lg text-xs", title:"화면 맞춤" }, "Fit")
      );
    }

    function App() {
      const [activeId, setActiveIdState] = useState(() => {
        const match = window.location.hash.match(/^#node=(.+)$/);
        return match && NODES[match[1]] ? match[1] : null;
      });
      const [summaryCollapsed, setSummaryCollapsed] = useState(true);
      const [guideMode, setGuideMode] = useState(() => {
        if (window.location.hash === "#onboarding") return "onboarding";
        if (window.location.hash === "#next") return "next";
        return null;
      });
      const panZoom = usePanZoom();
      const setActiveNode = useCallback((nodeId) => {
        setGuideMode(null);
        setActiveIdState(nodeId);
        document.querySelectorAll(".mermaid-wrap .node").forEach((node) => { node.style.opacity = nodeId ? ".35" : "1"; });
        if (nodeId) {
          const selected = document.querySelector('.mermaid-wrap .node[id*="' + nodeId + '"]');
          if (selected) selected.style.opacity = "1";
        }
      }, []);
      const closeDetail = useCallback(() => {
        setActiveIdState(null);
        document.querySelectorAll(".mermaid-wrap .node").forEach((node) => { node.style.opacity = "1"; });
      }, []);
      const openGuide = useCallback((mode) => { closeDetail(); setGuideMode(mode); }, [closeDetail]);
      const onRendered = useCallback(() => { window.setTimeout(panZoom.fitToScreen,150); }, [panZoom.fitToScreen]);

      return h(window.React.Fragment, null,
        h("header", { className:"fixed top-0 inset-x-0 z-30 px-6 py-4 bg-gradient-to-b from-black via-black/90 to-transparent flex items-start justify-between gap-4" },
          h("div", { className:"pointer-events-none" },
            h("h1", { className:"text-base font-semibold text-white" }, "Auto Error Handler"),
            h("p", { className:"text-sm text-wt-muted mt-0.5" }, "등록 → MQ → Codex 분석 → 승인 → 안전한 패치")
          ),
          h("div", { className:"header-actions flex items-center gap-2" },
            h("button", { onClick:() => openGuide("onboarding"), className:"px-3 py-2 rounded-lg border border-wt-accent/50 bg-wt-accent/10 text-xs text-wt-file hover:bg-wt-accent hover:text-white transition" }, h("span", null, "외부 서비스 "), "등록 흐름"),
            h("button", { onClick:() => openGuide("next"), className:"px-3 py-2 rounded-lg border border-wt-border bg-wt-surface text-xs text-wt-muted hover:border-wt-accent hover:text-white transition" }, h("span", null, "프로젝트 "), "다음 할 일")
          )
        ),
        h(Summary, { collapsed:summaryCollapsed, onToggle:() => setSummaryCollapsed((value) => !value) }),
        h("main", { ref:panZoom.viewportRef, className:"grid-bg w-full h-screen overflow-hidden cursor-grab active:cursor-grabbing" },
          h("div", { ref:panZoom.canvasRef, className:"origin-top-left will-change-transform inline-block p-[110px_70px_90px]" },
            h(MermaidDiagram, { onNodeClick:setActiveNode, onRendered })
          )
        ),
        h(ZoomControls, { zoomDisplayRef:panZoom.zoomDisplayRef, onZoomIn:panZoom.zoomIn, onZoomOut:panZoom.zoomOut, onFit:panZoom.fitToScreen }),
        h("div", { className:"legend fixed bottom-5 left-1/2 -translate-x-1/2 z-20 flex gap-4 px-4 py-2 glass border border-wt-border rounded-lg shadow-xl" },
          LEGEND.map((item) => h("span", { key:item.label, className:"flex items-center gap-1.5 text-[11px] text-wt-muted" },
            h("span", { className:"w-2 h-2 rounded-full " + item.color }), item.label
          ))
        ),
        activeId && NODES[activeId] ? h(DetailPanel, { nodeId:activeId, node:NODES[activeId], onClose:closeDetail }) : null,
        guideMode ? h(GuidePanel, { mode:guideMode, onMode:setGuideMode, onClose:() => setGuideMode(null) }) : null,
        h("div", { className:"keyboard-hint fixed bottom-5 right-5 z-20 text-xs text-wt-muted opacity-50" },
          h("kbd", null, "Scroll"), " zoom · ", h("kbd", null, "Drag"), " pan · 노드 클릭"
        )
      );
    }

    window.ReactDOM.createRoot(document.getElementById("root")).render(h(App));
  </script>
</body>
</html>

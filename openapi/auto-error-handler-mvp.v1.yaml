openapi: 3.1.0
info:
  title: Auto Error Handler MVP API
  version: 1.0.0
  description: 오류 이벤트 접수, Incident 분석, 승인, 패치 결과 조회를 위한 기능 MVP 계약
servers:
  - url: http://localhost:8000
tags:
  - name: Error Events
  - name: Incidents
  - name: Approvals

paths:
  /v1/error-events:
    post:
      tags: [Error Events]
      operationId: ingestErrorEvent
      summary: 오류 이벤트 접수
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/external-error-event-v1.schema.json'
      responses:
        '202':
          description: 이벤트 저장 및 분석 Job 예약 완료
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEventAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '413': { $ref: '#/components/responses/ContentTooLarge' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/incidents:
    get:
      tags: [Incidents]
      operationId: listIncidents
      summary: Incident 목록 조회
      parameters:
        - name: serviceKey
          in: query
          schema: { type: string }
        - name: state
          in: query
          schema: { $ref: '#/components/schemas/IncidentState' }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Incident 목록
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncidentList' }

  /v1/incidents/{incidentId}:
    get:
      tags: [Incidents]
      operationId: getIncident
      summary: Incident 상세 조회
      parameters:
        - $ref: '#/components/parameters/IncidentId'
      responses:
        '200':
          description: Incident 상세
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncidentDetail' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/incidents/{incidentId}/analysis:
    get:
      tags: [Incidents]
      operationId: getIncidentAnalysis
      summary: 최신 분석 결과 조회
      parameters:
        - $ref: '#/components/parameters/IncidentId'
      responses:
        '200':
          description: 분석 실행과 구조화 결과
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalysisRun' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/incidents/{incidentId}/approve:
    post:
      tags: [Approvals]
      operationId: approveIncidentPatch
      summary: 최신 분석의 패치 승인
      description: 요청 본문은 받지 않는다. 서버가 Incident를 잠근 뒤 유일한 성공 분석과 그 기준 commit SHA를 승인 기록과 Patch 실행에 고정한다.
      x-decision-id: DEC-007
      parameters:
        - $ref: '#/components/parameters/IncidentId'
        - name: Idempotency-Key
          in: header
          required: true
          description: 승인 요청 멱등성 UUID
          schema: { type: string, format: uuid }
      responses:
        '202':
          description: 승인과 Patch Job 저장 완료
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalAccepted' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/incidents/{incidentId}/patch:
    get:
      tags: [Incidents]
      operationId: getIncidentPatch
      summary: 최신 패치와 검증 결과 조회
      parameters:
        - $ref: '#/components/parameters/IncidentId'
      responses:
        '200':
          description: 패치 실행 결과
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PatchRun' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  parameters:
    IncidentId:
      name: incidentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: body의 eventId와 같은 UUID
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: JSON 문법·객체 키 중복 또는 헤더 형식 오류
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ContentTooLarge:
      description: 요청 body가 MVP byte limit을 초과
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: 등록 서비스 또는 리소스가 없음
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: payload 충돌 또는 허용되지 않은 상태 전이
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ValidationFailed:
      description: 요청 스키마 검증 실패 또는 JSON 정규화 불가
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ValidationProblem' }
    InternalError:
      description: 저장 또는 내부 처리 실패
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ServiceUnavailable:
      description: 저장소를 일시적으로 읽을 수 없거나 미완료 작업 상한에 도달함
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    CommitSha:
      type: string
      pattern: '^(?:[0-9a-fA-F]{40}|[0-9a-fA-F]{64})$'

    IncidentState:
      type: string
      enum: [RECEIVED, ANALYZING, AWAITING_APPROVAL, ANALYSIS_FAILED, PATCHING, VALIDATING, PATCH_READY, PATCH_FAILED]

    ErrorEventAccepted:
      type: object
      additionalProperties: false
      required: [eventId, incidentId, status, duplicate]
      properties:
        eventId: { type: string, format: uuid }
        incidentId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/IncidentState' }
        duplicate: { type: boolean }

    IncidentSummary:
      type: object
      required: [id, serviceKey, state, fingerprint, occurrenceCount, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        serviceKey: { type: string }
        state: { $ref: '#/components/schemas/IncidentState' }
        fingerprint: { type: string }
        occurrenceCount: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    IncidentDetail:
      allOf:
        - $ref: '#/components/schemas/IncidentSummary'
        - type: object
          required: [version, environment, baseCommitSha]
          properties:
            version: { type: integer, minimum: 1 }
            environment: { enum: [production, staging, development, test] }
            baseCommitSha: { $ref: '#/components/schemas/CommitSha' }
            latestAnalysis:
              oneOf:
                - $ref: '#/components/schemas/AnalysisRun'
                - type: 'null'
            latestPatch:
              oneOf:
                - $ref: '#/components/schemas/PatchRunSummary'
                - type: 'null'

    IncidentList:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/IncidentSummary' }
        nextCursor: { type: [string, 'null'] }

    RunStatus:
      type: string
      enum: [PENDING, RUNNING, SUCCEEDED, FAILED]

    AnalysisRun:
      type: object
      additionalProperties: false
      required: [id, incidentId, status, baseCommitSha, inputEventId, policySummary]
      properties:
        id: { type: string, format: uuid }
        incidentId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/RunStatus' }
        baseCommitSha: { $ref: '#/components/schemas/CommitSha' }
        inputEventId: { type: string, format: uuid }
        policySummary: { $ref: '#/components/schemas/PolicySummary' }
        codexThreadId: { type: [string, 'null'] }
        result:
          oneOf:
            - $ref: '#/components/schemas/AnalysisResult'
            - type: 'null'
        error: { type: [string, 'null'] }
        startedAt: { type: [string, 'null'], format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }

    PolicySummary:
      type: object
      additionalProperties: false
      required: [allowedPaths, deniedPaths, maxChangedFiles, maxDiffLines, validationCommands, model]
      properties:
        allowedPaths:
          type: array
          items: { type: string }
        deniedPaths:
          type: array
          items: { type: string }
        maxChangedFiles: { type: integer, minimum: 1 }
        maxDiffLines: { type: integer, minimum: 1 }
        validationCommands:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, timeoutSeconds]
            properties:
              id: { type: string }
              timeoutSeconds: { type: integer, minimum: 1 }
        model: { type: string }

    AnalysisResult:
      type: object
      additionalProperties: false
      required: [summary, rootCause, confidence, evidence, proposedChanges, validationPlan, reproductionAssessment, risk, missingInformation]
      properties:
        summary: { type: string }
        rootCause: { type: string }
        confidence: { enum: [low, medium, high] }
        evidence:
          type: array
          items: { $ref: '#/components/schemas/Evidence' }
        proposedChanges:
          type: array
          items: { $ref: '#/components/schemas/ProposedChange' }
        validationPlan:
          type: array
          items: { type: string }
        reproductionAssessment: { $ref: '#/components/schemas/ReproductionAssessment' }
        risk: { enum: [low, medium, high] }
        missingInformation:
          type: array
          items: { type: string }

    Evidence:
      type: object
      additionalProperties: false
      required: [path, explanation]
      properties:
        path: { type: string }
        symbol: { type: [string, 'null'] }
        explanation: { type: string }

    ProposedChange:
      type: object
      additionalProperties: false
      required: [path, purpose, operation]
      properties:
        path: { type: string }
        purpose: { type: string }
        operation: { enum: [modify, add, delete] }

    ReproductionAssessment:
      type: object
      additionalProperties: false
      required: [reproducible, reason, suggestedRegressionTests]
      properties:
        reproducible: { type: boolean }
        reason: { type: string }
        suggestedRegressionTests:
          type: array
          items: { type: string }

    ApprovalAccepted:
      type: object
      additionalProperties: false
      required: [incidentId, approvalId, patchRunId, status, duplicate]
      properties:
        incidentId: { type: string, format: uuid }
        approvalId: { type: string, format: uuid }
        patchRunId: { type: string, format: uuid }
        status: { const: PATCHING }
        duplicate: { type: boolean }

    PatchRunSummary:
      type: object
      required: [id, status]
      properties:
        id: { type: string, format: uuid }
        status: { enum: [PENDING, RUNNING, VALIDATING, PATCH_READY, PATCH_FAILED] }

    PatchRun:
      allOf:
        - $ref: '#/components/schemas/PatchRunSummary'
        - type: object
          required: [incidentId, baseCommitSha, changedFiles, validation]
          properties:
            incidentId: { type: string, format: uuid }
            baseCommitSha: { $ref: '#/components/schemas/CommitSha' }
            changedFiles:
              type: array
              items: { type: string }
            diff: { type: [string, 'null'] }
            validation:
              type: array
              items: { $ref: '#/components/schemas/ValidationStep' }
            error: { type: [string, 'null'] }

    ValidationStep:
      type: object
      additionalProperties: false
      required: [id, status, durationMs]
      properties:
        id: { type: string }
        status: { enum: [PASSED, FAILED, TIMED_OUT] }
        exitCode: { type: [integer, 'null'] }
        durationMs: { type: integer, minimum: 0 }
        output: { type: [string, 'null'] }

    Problem:
      type: object
      required: [type, title, status, code, traceId]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        code: { type: string }
        detail: { type: [string, 'null'] }
        instance: { type: [string, 'null'] }
        traceId: { type: string }

    ValidationProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [errors]
          properties:
            errors:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [path, message]
                properties:
                  path: { type: string }
                  message: { type: string }
